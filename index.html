<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GTA V Map PWA</title>
  
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f12;
      color: #fff;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      filter: invert(90%) hue-rotate(180deg) brightness(85%) contrast(120%);
    }

    .player-marker-icon {
      background-color: #a855f7 !important;
      border: 3px solid #ffffff !important;
      border-radius: 50% !important;
      box-shadow: 0 0 15px #a855f7, 0 0 25px rgba(168, 85, 247, 0.9) !important;
      animation: pulse-marker 1.5s infinite ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 11px;
    }

    .player-marker-icon.ghost {
      opacity: 0.45 !important;
      box-shadow: none !important;
      animation: none !important;
      border-color: #aaa !important;
    }

    @keyframes pulse-marker {
      0% { transform: scale(0.9); box-shadow: 0 0 8px #a855f7; }
      50% { transform: scale(1.2); box-shadow: 0 0 22px #a855f7; }
      100% { transform: scale(0.9); box-shadow: 0 0 8px #a855f7; }
    }

    .ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }

    .interactive {
      pointer-events: auto;
    }

    .search-box {
      background: rgba(18, 20, 29, 0.92);
      border: 1px solid rgba(168, 85, 247, 0.4);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.95rem;
      width: 100%;
      outline: none;
    }

    #ghost-banner {
      display: none;
      background: rgba(168, 85, 247, 0.25);
      border: 1px solid #a855f7;
      color: #fff;
      text-align: center;
      padding: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      border-radius: 6px;
      margin-top: 6px;
      text-transform: uppercase;
    }

    .hud-widgets-left {
      position: absolute;
      top: 75px;
      left: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hud-card {
      background: rgba(18, 20, 29, 0.88);
      border: 1px solid rgba(168, 85, 247, 0.3);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 8px 12px;
      min-width: 85px;
      text-align: center;
    }

    .hud-card .val {
      font-size: 1.1rem;
      font-weight: 800;
      color: #a855f7;
    }

    .hud-card .lbl {
      font-size: 0.6rem;
      color: #a0a0a0;
    }

    .hud-widgets-right {
      position: absolute;
      top: 75px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .circle-btn {
      width: 44px;
      height: 44px;
      background: rgba(18, 20, 29, 0.9);
      border: 1px solid rgba(168, 85, 247, 0.4);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      color: #a855f7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .circle-btn.active {
      background: #a855f7;
      color: #fff;
    }

    .bottom-panel {
      background: rgba(18, 20, 29, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px);
      border-radius: 18px;
      padding: 14px;
    }

    .destination-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .dest-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .dest-coords {
      font-size: 0.7rem;
      color: #888;
    }

    .mode-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-mode {
      flex: 1;
      padding: 9px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #aaa;
      font-weight: 600;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .btn-mode.active {
      background: #a855f7;
      color: #fff;
      border-color: #a855f7;
    }

    .hud-stats {
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 10px;
    }

    .stat-box {
      text-align: center;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }

    .stat-label {
      font-size: 0.65rem;
      color: #888;
    }

    #spotify-container {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 320px;
      z-index: 20;
      display: none;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="spotify-container" class="interactive">
    <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DX10z2A93Y233?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" loading="lazy"></iframe>
  </div>

  <div class="ui-container">
    <div>
      <div class="search-box interactive">
        <i class="fa-solid fa-magnifying-glass" style="color: #a855f7;"></i>
        <input type="text" id="search-input" placeholder="Buscar destino...">
      </div>
      <div id="ghost-banner">👻 MODO FANTASMA ACTIVADO</div>
    </div>

    <div class="hud-widgets-left">
      <div class="hud-card">
        <div class="val" id="speed-val">0 KM/H</div>
        <div class="lbl">VELOCIDAD</div>
      </div>
      <div class="hud-card">
        <div class="val" id="compass-val">N</div>
        <div class="lbl">BRÚJULA</div>
      </div>
    </div>

    <div class="hud-widgets-right">
      <div class="circle-btn interactive" id="recenter-btn"><i class="fa-solid fa-location-arrow"></i></div>
      <div class="circle-btn interactive" id="ghost-btn"><i class="fa-solid fa-ghost"></i></div>
      <div class="circle-btn interactive" id="radio-btn" style="color:#1db954;"><i class="fa-solid fa-radio"></i></div>
    </div>

    <div class="bottom-panel interactive">
      <div class="destination-info">
        <div>
          <div class="dest-title" id="dest-name">Toca en el mapa para fijar destino</div>
          <div class="dest-coords" id="dest-coords">Esperando selección...</div>
        </div>
        <i class="fa-solid fa-xmark" id="close-route-btn" style="color: #888; font-size: 1.2rem; cursor: pointer; display: none;"></i>
      </div>

      <div class="mode-selector">
        <button class="btn-mode active" id="btn-car"><i class="fa-solid fa-car"></i> En Auto</button>
        <button class="btn-mode" id="btn-walk"><i class="fa-solid fa-person-walking"></i> A Pie</button>
      </div>

      <div class="hud-stats">
        <div class="stat-box"><div class="stat-value" id="dist-val">-- km</div><div class="stat-label">DISTANCIA</div></div>
        <div class="stat-box"><div class="stat-value" id="eta-val">-- min</div><div class="stat-label">TIEMPO APROX</div></div>
        <div class="stat-box"><div class="stat-value" id="mode-val" style="color:#a855f7;">OSRM CAR</div><div class="stat-label">MODO RUTA</div></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map, userMarker, routeLayer, destMarker;
    let currentPos = null;
    let selectedDest = null;
    let currentMode = 'driving'; 
    let ghostMode = false;
    let lastPos = null;
    let lastTime = null;
    let firstFix = false;

    function initMap() {
      // Inicializar contenedor de mapa sin fijar marcador inicial
      map = L.map('map', { zoomControl: false, maxZoom: 18 }).setView([0, 0], 2);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

      map.createPane('playerPane');
      map.getPane('playerPane').style.zIndex = 990;

      map.on('click', (e) => {
        setDestination([e.latlng.lat, e.latlng.lng], 'Punto en el Mapa');
      });

      setupSearch();
      startGeolocation();
    }

    function setDestination(coords, name) {
      selectedDest = coords;
      if (!destMarker) {
        destMarker = L.marker(selectedDest).addTo(map);
      } else {
        destMarker.setLatLng(selectedDest);
      }

      document.getElementById('dest-name').innerText = name;
      document.getElementById('dest-coords').innerText = `${coords[0].toFixed(5)}, ${coords[1].toFixed(5)}`;
      document.getElementById('close-route-btn').style.display = 'block';

      if (currentPos) calculateRoute(currentPos, selectedDest);
    }

    function clearRoute() {
      if (routeLayer) {
        map.removeLayer(routeLayer);
        routeLayer = null;
      }
      if (destMarker) {
        map.removeLayer(destMarker);
        destMarker = null;
      }
      selectedDest = null;
      document.getElementById('dest-name').innerText = 'Toca en el mapa para fijar destino';
      document.getElementById('dest-coords').innerText = 'Esperando selección...';
      document.getElementById('dist-val').innerText = '-- km';
      document.getElementById('eta-val').innerText = '-- min';
      document.getElementById('close-route-btn').style.display = 'none';
    }

    function startGeolocation() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(onGpsSuccess, onGpsError, {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        });
      }
    }

    function onGpsSuccess(pos) {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const now = Date.now();

      if (lastPos && lastTime) {
        const distM = map.distance(lastPos, [lat, lng]);
        const timeS = (now - lastTime) / 1000;
        if (timeS > 0) {
          const speedKmH = Math.round((distM / timeS) * 3.6);
          document.getElementById('speed-val').innerText = speedKmH + ' KM/H';
        }
      }

      lastPos = [lat, lng];
      lastTime = now;
      currentPos = [lat, lng];

      // Pinta el marcador SOLAMENTE cuando el GPS confirma la ubicación exacta
      if (!userMarker) {
        const playerIcon = L.divIcon({
          className: 'player-marker-icon' + (ghostMode ? ' ghost' : ''),
          html: `<i class="fa-solid fa-location-crosshairs"></i>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });

        userMarker = L.marker([lat, lng], {
          icon: playerIcon,
          pane: 'playerPane'
        }).addTo(map);
      } else {
        userMarker.setLatLng([lat, lng]);
      }

      // Centra automáticamente la primera vez que detecta tu ubicación real
      if (!firstFix) {
        map.setView([lat, lng], 17);
        firstFix = true;
      } else if (!ghostMode) {
        map.panTo([lat, lng]);
      }

      if (selectedDest) calculateRoute(currentPos, selectedDest);
    }

    function onGpsError(err) {
      console.warn("GPS no listo:", err);
    }

    function calculateRoute(start, end) {
      if (!selectedDest) return;
      if (routeLayer) map.removeLayer(routeLayer);

      const profile = currentMode === 'walking' ? 'foot' : 'car';
      const url = `https://router.project-osrm.org/route/v1/${profile}/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.routes && data.routes[0]) {
            const route = data.routes[0];
            const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

            routeLayer = L.polyline(coords, {
              color: '#a855f7',
              weight: 5,
              opacity: 0.9
            }).addTo(map);

            document.getElementById('dist-val').innerText = (route.distance / 1000).toFixed(2) + ' km';
            document.getElementById('eta-val').innerText = Math.ceil(route.duration / 60) + ' min';
            document.getElementById('mode-val').innerText = 'OSRM ' + currentMode.toUpperCase();
          }
        });
    }

    function setupSearch() {
      const input = document.getElementById('search-input');
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && input.value) {
          fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(input.value)}`)
            .then(res => res.json())
            .then(data => {
              if (data && data.length > 0) {
                const coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                setDestination(coords, data[0].display_name.split(',')[0]);
                map.setView(coords, 17);
              }
            });
        }
      });
    }

    document.getElementById('btn-car').onclick = function() {
      document.getElementById('btn-walk').classList.remove('active');
      this.classList.add('active');
      currentMode = 'driving';
      if (currentPos && selectedDest) calculateRoute(currentPos, selectedDest);
    };

    document.getElementById('btn-walk').onclick = function() {
      document.getElementById('btn-car').classList.remove('active');
      this.classList.add('active');
      currentMode = 'walking';
      if (currentPos && selectedDest) calculateRoute(currentPos, selectedDest);
    };

    document.getElementById('recenter-btn').onclick = () => {
      if (currentPos) map.setView(currentPos, 17);
    };

    document.getElementById('ghost-btn').onclick = function() {
      ghostMode = !ghostMode;
      this.classList.toggle('active', ghostMode);
      document.getElementById('ghost-banner').style.display = ghostMode ? 'block' : 'none';
      if (userMarker) {
        if (ghostMode) userMarker.getElement()?.classList.add('ghost');
        else userMarker.getElement()?.classList.remove('ghost');
      }
    };

    document.getElementById('radio-btn').onclick = () => {
      const c = document.getElementById('spotify-container');
      c.style.display = c.style.display === 'block' ? 'none' : 'block';
    };

    document.getElementById('close-route-btn').onclick = clearRoute;

    window.onload = initMap;
  </script>
</body>
</html>
