<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GTA V Radar HUD</title>
  
  <!-- Evitar caché en navegadores móviles -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="theme-color" content="#000000">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Teko', 'Impact', sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #fff;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background: #090d12;
    }

    /* Marcador Jugador (Flecha Neón GTA V) */
    .gta-player-marker {
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-bottom: 22px solid #3498db;
      filter: drop-shadow(0 0 6px #3498db) drop-shadow(0 0 2px #fff);
    }

    .ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
    }

    .interactive {
      pointer-events: auto;
    }

    .search-box {
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #333;
      border-left: 5px solid #f1c40f;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      letter-spacing: 1px;
      width: 100%;
      outline: none;
      text-transform: uppercase;
    }

    .hud-left {
      position: absolute;
      top: 65px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .gta-box {
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #222;
      padding: 4px 10px;
      min-width: 90px;
    }

    .gta-box .val {
      font-size: 1.6rem;
      line-height: 1;
      font-weight: 700;
      color: #2ecc71;
    }

    .gta-box .lbl {
      font-size: 0.75rem;
      color: #aaa;
      text-transform: uppercase;
    }

    .hud-right {
      position: absolute;
      top: 65px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gta-btn-icon {
      width: 40px;
      height: 40px;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #444;
      color: #f1c40f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .gta-bottom-panel {
      background: rgba(0, 0, 0, 0.92);
      border: 2px solid #333;
      border-top: 4px solid #a855f7;
      padding: 10px 14px;
    }

    .dest-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .dest-title {
      font-size: 1.2rem;
      color: #fff;
      text-transform: uppercase;
    }

    .mode-btn-group {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .gta-mode-btn {
      flex: 1;
      padding: 4px;
      background: #111;
      border: 1px solid #444;
      color: #888;
      font-size: 1rem;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
    }

    .gta-mode-btn.active {
      background: #a855f7;
      color: #fff;
      border-color: #a855f7;
    }

    .gta-stats-row {
      display: flex;
      justify-content: space-between;
      border-top: 1px dashed #333;
      padding-top: 6px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-item .v {
      font-size: 1.3rem;
      color: #f1c40f;
      line-height: 1;
    }

    .stat-item .l {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
    }

    #spotify-container {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 320px;
      z-index: 20;
      display: none;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="spotify-container" class="interactive">
    <iframe style="border:2px solid #333;" src="https://open.spotify.com/embed/playlist/37i9dQZF1DX10z2A93Y233?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" loading="lazy"></iframe>
  </div>

  <div class="ui-container">
    <div>
      <div class="search-box interactive">
        <i class="fa-solid fa-magnifying-glass" style="color: #f1c40f;"></i>
        <input type="text" id="search-input" placeholder="BUSCAR DESTINO...">
      </div>
    </div>

    <div class="hud-left">
      <div class="gta-box">
        <div class="val" id="speed-val">0 KM/H</div>
        <div class="lbl">VELOCIDAD</div>
      </div>
      <div class="gta-box">
        <div class="val" id="compass-val" style="color:#f1c40f;">N</div>
        <div class="lbl">BRÚJULA</div>
      </div>
    </div>

    <div class="hud-right">
      <div class="gta-btn-icon interactive" id="recenter-btn"><i class="fa-solid fa-location-arrow"></i></div>
      <div class="gta-btn-icon interactive" id="ghost-btn"><i class="fa-solid fa-ghost"></i></div>
      <div class="gta-btn-icon interactive" id="radio-btn" style="color:#1db954;"><i class="fa-solid fa-radio"></i></div>
    </div>

    <div class="gta-bottom-panel interactive">
      <div class="dest-header">
        <div class="dest-title" id="dest-name">TOCA EL MAPA PARA FIJAR DESTINO</div>
        <i class="fa-solid fa-xmark" id="close-route-btn" style="color: #888; font-size: 1.2rem; cursor: pointer; display: none;"></i>
      </div>

      <div class="mode-btn-group">
        <div class="gta-mode-btn active" id="btn-car"><i class="fa-solid fa-car"></i> AUTO</div>
        <div class="gta-mode-btn" id="btn-walk"><i class="fa-solid fa-person-walking"></i> A PIE</div>
      </div>

      <div class="gta-stats-row">
        <div class="stat-item"><div class="v" id="dist-val">-- KM</div><div class="l">DISTANCIA</div></div>
        <div class="stat-item"><div class="v" id="eta-val">-- MIN</div><div class="l">TIEMPO</div></div>
        <div class="stat-item"><div class="v" id="mode-val" style="color:#a855f7;">OSRM CAR</div><div class="l">MODO</div></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map, userMarker, routeLayer, destMarker;
    let currentPos = null;
    let selectedDest = null;
    let currentMode = 'driving'; 
    let ghostMode = false;
    let lastPos = null;
    let lastTime = null;
    let firstFix = false;

    function initMap() {
      // Mapa CartoDB Dark Matter (Oscuro Nativo de GTA)
      map = L.map('map', { zoomControl: false, maxZoom: 18 }).setView([0, 0], 2);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 18,
        subdomains: 'abcd'
      }).addTo(map);

      map.createPane('playerPane');
      map.getPane('playerPane').style.zIndex = 990;

      map.on('click', (e) => {
        setDestination([e.latlng.lat, e.latlng.lng], 'PUNTO EN EL MAPA');
      });

      setupSearch();
      startGeolocation();
    }

    function setDestination(coords, name) {
      selectedDest = coords;
      if (!destMarker) {
        destMarker = L.marker(selectedDest).addTo(map);
      } else {
        destMarker.setLatLng(selectedDest);
      }

      document.getElementById('dest-name').innerText = name;
      document.getElementById('close-route-btn').style.display = 'block';

      if (currentPos) calculateRoute(currentPos, selectedDest);
    }

    function clearRoute() {
      if (routeLayer) {
        map.removeLayer(routeLayer);
        routeLayer = null;
      }
      if (destMarker) {
        map.removeLayer(destMarker);
        destMarker = null;
      }
      selectedDest = null;
      document.getElementById('dest-name').innerText = 'TOCA EL MAPA PARA FIJAR DESTINO';
      document.getElementById('dist-val').innerText = '-- KM';
      document.getElementById('eta-val').innerText = '-- MIN';
      document.getElementById('close-route-btn').style.display = 'none';
    }

    function startGeolocation() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(onGpsSuccess, onGpsError, {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        });
      }
    }

    function onGpsSuccess(pos) {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const now = Date.now();

      if (lastPos && lastTime) {
        const distM = map.distance(lastPos, [lat, lng]);
        const timeS = (now - lastTime) / 1000;
        if (timeS > 0) {
          const speedKmH = Math.round((distM / timeS) * 3.6);
          document.getElementById('speed-val').innerText = speedKmH + ' KM/H';
        }
      }

      lastPos = [lat, lng];
      lastTime = now;
      currentPos = [lat, lng];

      // Dibuja la flecha del jugador solo al confirmar GPS real
      if (!userMarker) {
        const playerIcon = L.divIcon({
          className: 'gta-player-marker',
          iconSize: [18, 22],
          iconAnchor: [9, 11]
        });

        userMarker = L.marker([lat, lng], {
          icon: playerIcon,
          pane: 'playerPane'
        }).addTo(map);
      } else {
        userMarker.setLatLng([lat, lng]);
      }

      if (!firstFix) {
        map.setView([lat, lng], 17);
        firstFix = true;
      } else if (!ghostMode) {
        map.panTo([lat, lng]);
      }

      if (selectedDest) calculateRoute(currentPos, selectedDest);
    }

    function onGpsError(err) {
      console.warn("GPS:", err);
    }

    function calculateRoute(start, end) {
      if (!selectedDest) return;
      if (routeLayer) map.removeLayer(routeLayer);

      const profile = currentMode === 'walking' ? 'foot' : 'car';
      const url = `https://router.project-osrm.org/route/v1/${profile}/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.routes && data.routes[0]) {
            const route = data.routes[0];
            const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

            routeLayer = L.polyline(coords, {
              color: '#a855f7',
              weight: 6,
              opacity: 0.9
            }).addTo(map);

            document.getElementById('dist-val').innerText = (route.distance / 1000).toFixed(2) + ' KM';
            document.getElementById('eta-val').innerText = Math.ceil(route.duration / 60) + ' MIN';
            document.getElementById('mode-val').innerText = 'OSRM ' + currentMode.toUpperCase();
          }
        });
    }

    function setupSearch() {
      const input = document.getElementById('search-input');
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && input.value) {
          fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(input.value)}`)
            .then(res => res.json())
            .then(data => {
              if (data && data.length > 0) {
                const coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                setDestination(coords, data[0].display_name.split(',')[0]);
                map.setView(coords, 17);
              }
            });
        }
      });
    }

    document.getElementById('btn-car').onclick = function() {
      document.getElementById('btn-walk').classList.remove('active');
      this.classList.add('active');
      currentMode = 'driving';
      if (currentPos && selectedDest) calculateRoute(currentPos, selectedDest);
    };

    document.getElementById('btn-walk').onclick = function() {
      document.getElementById('btn-car').classList.remove('active');
      this.classList.add('active');
      currentMode = 'walking';
      if (currentPos && selectedDest) calculateRoute(currentPos, selectedDest);
    };

    document.getElementById('recenter-btn').onclick = () => {
      if (currentPos) map.setView(currentPos, 17);
    };

    document.getElementById('ghost-btn').onclick = function() {
      ghostMode = !ghostMode;
      this.classList.toggle('active', ghostMode);
    };

    document.getElementById('radio-btn').onclick = () => {
      const c = document.getElementById('spotify-container');
      c.style.display = c.style.display === 'block' ? 'none' : 'block';
    };

    document.getElementById('close-route-btn').onclick = clearRoute;

    window.onload = initMap;
  </script>
</body>
</html>
